openapi: 3.0.3
info:
  title: Games API
  version: 1.0.0
  description: Course backend using an in-memory array. Restarting the server resets
    all data. Errors are JSON objects with an error property. GET /games returns names
    only; GET /games/{id} returns full details.
servers:
- url: /
  description: Current API server
tags:
- name: games
  description: List, read, create and delete games
paths:
  /games:
    get:
      tags:
      - games
      summary: Returns a list of game names
      operationId: listGames
      responses:
        '200':
          description: Game names only, without full details.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - The Witcher 3
              - Cyberpunk 2077
              - Minecraft
    post:
      tags:
      - games
      summary: Creates a new game
      operationId: createGame
      requestBody:
        required: true
        description: Name and non-negative numeric price. The server assigns the ID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGame'
            example:
              name: Tetris
              price: 0.99
      responses:
        '201':
          description: Game created. Location identifies the new resource.
          headers:
            Location:
              description: URL of the created game
              schema:
                type: string
                format: uri
              example: http://localhost:8080/games/4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
              example:
                id: 4
                name: Tetris
                price: 0.99
        '400':
          description: Missing or invalid fields, missing JSON body, or malformed
            JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing or invalid fields, missing JSON body, or malformed
                  JSON.
        '413':
          description: Request body is too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Request body is too large.
  /games/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Positive integer game ID.
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      example: 1
    get:
      tags:
      - games
      summary: Returns full details of a game
      operationId: getGame
      responses:
        '200':
          description: Full game details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
              example: &id001
                id: 1
                name: The Witcher 3
                price: 29.99
        '400':
          description: id must be a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: id must be a positive integer.
        '404':
          description: Game 999 was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Game 999 was not found.
    delete:
      tags:
      - games
      summary: Deletes a game
      description: The ID is taken from the URL. No request body is required.
      operationId: deleteGame
      responses:
        '204':
          description: Game deleted. The response body is empty.
        '400':
          description: id must be a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: id must be a positive integer.
        '404':
          description: Game 999 was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Game 999 was not found.
components:
  schemas:
    Game:
      type: object
      required:
      - id
      - name
      - price
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          readOnly: true
        name:
          type: string
          minLength: 1
          pattern: \S
        price:
          type: number
          format: double
          minimum: 0
      example: *id001
    NewGame:
      type: object
      required:
      - name
      - price
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
        price:
          type: number
          format: double
          minimum: 0
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
      example:
        error: Game 999 was not found.
