openapi: 3.0.3
info:
  title: Games API
  version: 1.0.0
  description: Course backend using an in-memory array. Restarting the server resets
    all data. Errors are JSON objects with an error property. GET /games returns names
    only; GET /games/{id} returns full details.
servers:
- url: /
  description: Current API server
tags:
- name: games
  description: List, read, create and delete games
paths:
  /games:
    get:
      tags:
      - games
      summary: Returns a list of game names
      operationId: listGames
      responses:
        '200':
          description: Game names only, without full details.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - The Witcher 3
              - Cyberpunk 2077
              - Minecraft
  /games/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Positive integer game ID.
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      example: 1
    get:
      tags:
      - games
      summary: Returns full details of a game
      operationId: getGame
      responses:
        '200':
          description: Full game details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
              example: &id001
                id: 1
                name: The Witcher 3
                price: 29.99
        '400':
          description: id must be a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: id must be a positive integer.
        '404':
          description: Game 999 was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Game 999 was not found.
components:
  schemas:
    Game:
      type: object
      required:
      - id
      - name
      - price
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          readOnly: true
        name:
          type: string
          minLength: 1
          pattern: \S
        price:
          type: number
          format: double
          minimum: 0
      example: *id001
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
      example:
        error: Game 999 was not found.
